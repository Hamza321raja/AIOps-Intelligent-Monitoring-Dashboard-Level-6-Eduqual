server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Business application API (load generator + fault injection)
  location /api/ {
    proxy_pass http://app:3000/;
    proxy_set_header Host $host;
  }

  # AIOps engine API (status, incidents, approvals, SLA report)
  location /engine/ {
    proxy_pass http://aiops-engine:8000/;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
  }
}
