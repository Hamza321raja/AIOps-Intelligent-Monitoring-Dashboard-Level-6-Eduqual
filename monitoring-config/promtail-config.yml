server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # app.log (application), aiops.log (engine decisions), audit.log (audit trail)
  - job_name: aiops-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: aiops
          __path__: /var/log/aiops/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            type: type
            event: event
      - labels:
          level:
          type:
          event:
